<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario por Folio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1A66CC;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .titulo {
            color: #1a237e;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .campo {
            margin: 15px 0;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .etiqueta {
            font-size: 11px;
            text-transform: uppercase;
            color: #7f8c8d;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .valor {
            font-size: 18px;
            color: #2c3e50;
            margin-top: 3px;
            font-weight: 500;
        }
        
        .error {
            text-align: center;
            padding: 30px 20px;
        }
        
        .error h2 {
            color: #e74c3c;
            margin-bottom: 10px;
        }
        
        .error p {
            color: #7f8c8d;
            margin: 5px 0;
        }
        
        .badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 15px;
        }
        
        .badge-estado {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .badge-exitoso {
            background: #27ae60;
            color: white;
        }
        
        .badge-pendiente {
            background: #f39c12;
            color: white;
        }
        
        .badge-dano {
            background: #e74c3c;
            color: white;
        }
        
        .badge-mantenimiento {
            background: #3498db;
            color: white;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #bdc3c7;
        }
        
        .folio-destacado {
            background: #1a237e;
            color: white;
            padding: 2px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .clave-unica {
            background: #e8eef5;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .info-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .info-item .label {
            font-size: 10px;
            text-transform: uppercase;
            color: #7f8c8d;
            font-weight: 700;
        }
        
        .info-item .value {
            font-size: 14px;
            color: #2c3e50;
            margin-top: 2px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card" id="contenido">
    <div class="loading">
        <div class="spinner"></div>
        <p>Cargando información del equipo...</p>
    </div>
</div>

<script>
    // =====================================================
    // CONFIGURACIÓN - USA EL ENLACE DE PUBLICACIÓN
    // =====================================================
    
    // El enlace de publicación de tu Google Sheets
    const URL_PUBLICA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQTX8kmNGVvk4AdbfLHyopREllBJ1jjlmfdn2nShpYbWDhnaLEdfBtjA75mL1-IwLFn3KB8kCVGVcLg/pub?gid=1290902843&single=true&output=csv';
    
    // =====================================================
    // NO TOCAR DEBAJO DE ESTA LÍNEA
    // =====================================================
    
    function obtenerParametro(nombre) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(nombre);
    }
    
    function obtenerClaseEstado(estado) {
        const estados = {
            'En funcionamiento': 'badge-exitoso',
            'En mantenimiento': 'badge-mantenimiento',
            'Con daño': 'badge-dano',
            'Pendiente de revisión': 'badge-pendiente'
        };
        return estados[estado] || 'badge-pendiente';
    }
    
    async function obtenerDatosDeGoogleSheets() {
        try {
            const response = await fetch(URL_PUBLICA);
            
            if (!response.ok) {
                throw new Error('Error al obtener los datos');
            }
            
            const csvText = await response.text();
            
            // Convertir CSV a JSON
            const lineas = csvText.split('\n').filter(linea => linea.trim() !== '');
            const encabezados = lineas[0].split(',').map(h => h.trim());
            
            const resultados = [];
            for (let i = 1; i < lineas.length; i++) {
                const valores = lineas[i].split(',').map(v => v.trim());
                const obj = {};
                for (let j = 0; j < encabezados.length; j++) {
                    let valor = valores[j] || '';
                    valor = valor.replace(/^"|"$/g, ''); // Eliminar comillas al inicio y final
                    obj[encabezados[j]] = valor;
                }
                resultados.push(obj);
            }
            
            return resultados;
        } catch (error) {
            console.error('Error al cargar datos:', error);
            return null;
        }
    }
    
    async function mostrarEquipo() {
        const contenedor = document.getElementById('contenido');
        const folioBuscado = obtenerParametro('folio');
        
        // Si no hay folio en la URL
        if (!folioBuscado) {
            contenedor.innerHTML = `
                <div class="error">
                    <h2>📱 Escanea un código QR</h2>
                    <p>Este visor mostrará la información del equipo</p>
                    <div style="margin-top: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px;">
                        <p style="font-size: 14px; color: #555;">Ejemplo de URL:</p>
                        <code style="background: #e8eef5; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
                            index.html?folio=A#001
                        </code>
                    </div>
                    <div class="badge">Sistema de inventario</div>
                </div>
            `;
            return;
        }
        
        // Mostrar loading
        contenedor.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Buscando equipo <strong>${folioBuscado}</strong>...</p>
            </div>
        `;
        
        // Obtener datos de Google Sheets
        const datos = await obtenerDatosDeGoogleSheets();
        
        if (!datos) {
            contenedor.innerHTML = `
                <div class="error">
                    <h2>⚠️ Error de conexión</h2>
                    <p>No se pudo cargar el inventario</p>
                    <p style="font-size: 14px; margin-top: 10px; color: #95a5a6;">
                        Verifica tu conexión a internet
                    </p>
                </div>
            `;
            return;
        }
        
        // Buscar el equipo por folio
        const equipo = datos.find(item => item.Folio === folioBuscado);
        
        if (!equipo) {
            // Mostrar folios disponibles para ayudar al usuario
            const foliosDisponibles = datos.map(item => item.Folio).filter(Boolean);
            const muestraFolios = foliosDisponibles.slice(0, 15);
            
            contenedor.innerHTML = `
                <div class="error">
                    <h2>❌ Equipo no encontrado</h2>
                    <p>No existe un equipo con el folio:</p>
                    <p style="font-size: 24px; font-weight: bold; color: #1a237e; margin: 10px 0;">
                        ${folioBuscado}
                    </p>
                    <p style="font-size: 14px; color: #95a5a6; margin-top: 10px;">
                        Verifica que el folio sea correcto
                    </p>
                    ${foliosDisponibles.length > 0 ? `
                        <div style="margin-top: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px; text-align: left;">
                            <p style="font-size: 12px; color: #666;">📌 Folios disponibles (${foliosDisponibles.length} en total):</p>
                            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;">
                                ${muestraFolios.map(f => `<span style="display: inline-block; background: #e8eef5; padding: 2px 8px; border-radius: 4px; font-size: 11px;">${f}</span>`).join('')}
                                ${foliosDisponibles.length > 15 ? `<span style="display: inline-block; background: #e8eef5; padding: 2px 8px; border-radius: 4px; font-size: 11px;">+${foliosDisponibles.length - 15} más</span>` : ''}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            return;
        }
        
        const claseEstado = obtenerClaseEstado(equipo.Estado);
        
        // Mostrar los datos del equipo encontrado
        contenedor.innerHTML = `
            <h1 class="titulo">${equipo.Equipo || 'Equipo'}</h1>
            
            <div class="campo">
                <div class="etiqueta">Folio</div>
                <div class="valor"><span class="folio-destacado">${equipo.Folio}</span></div>
            </div>
            
            <div class="campo">
                <div class="etiqueta">Ubicación / Área</div>
                <div class="valor">${equipo['Hoja de Origen'] || 'No especificada'}</div>
            </div>
            
            <div class="campo">
                <div class="etiqueta">Característica / Detalle</div>
                <div class="valor">${equipo.Característica || 'No especificada'}</div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0;">
                <div class="campo" style="border-left-color: #3498db; margin: 0;">
                    <div class="etiqueta">Hoja de Origen</div>
                    <div class="valor" style="font-size: 16px;">${equipo['Hoja de Origen'] || 'N/A'}</div>
                </div>
                <div class="campo" style="border-left-color: #9b59b6; margin: 0;">
                    <div class="etiqueta">Ubicación exacta</div>
                    <div class="valor" style="font-size: 16px;">Fila ${equipo.Fila || 'N/A'}, Columna ${equipo.Columna || 'N/A'}</div>
                </div>
            </div>
            
            <div class="campo" style="border-left-color: ${equipo.Estado === 'En funcionamiento' ? '#27ae60' : '#f39c12'};">
                <div class="etiqueta">Estado</div>
                <div class="valor">
                    <span class="badge-estado ${claseEstado}">${equipo.Estado || 'No especificado'}</span>
                </div>
            </div>
            
            <div class="campo" style="border-left-color: #8e44ad;">
                <div class="etiqueta">Clave Única</div>
                <div class="valor"><span class="clave-unica">${equipo['Clave Única'] || 'No disponible'}</span></div>
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <span class="badge">✅ Datos actualizados</span>
            </div>
            
            <div class="footer">
                Última actualización: ${new Date().toLocaleString('es-ES', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })}
            </div>
        `;
    }
    
    // Ejecutar al cargar la página
    mostrarEquipo();
</script>

</body>
</html>

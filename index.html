<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario por Folio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        img {
            position: sticky;
            top: 0;  /* Se pega al top cuando llegas a ella */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1A66CC;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .titulo {
            color: #1a237e;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .campo {
            margin: 15px 0;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .etiqueta {
            font-size: 11px;
            text-transform: uppercase;
            color: #7f8c8d;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .valor {
            font-size: 18px;
            color: #2c3e50;
            margin-top: 3px;
            font-weight: 500;
        }
        
        /* Estilos para campos editables */
        .campo-editable input,
        .campo-editable select {
            width: 100%;
            padding: 8px 12px;
            margin-top: 5px;
            border: 2px solid #d1d9e6;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: white;
        }
        
        .campo-editable input:focus,
        .campo-editable select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .error {
            text-align: center;
            padding: 30px 20px;
        }
        
        .error h2 {
            color: #e74c3c;
            margin-bottom: 10px;
        }
        
        .error p {
            color: #7f8c8d;
            margin: 5px 0;
        }
        
        .badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 15px;
        }
        
        .badge-estado {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .badge-exitoso { background: #27ae60; color: white; }
        .badge-pendiente { background: #f39c12; color: white; }
        .badge-dano { background: #e74c3c; color: white; }
        .badge-mantenimiento { background: #3498db; color: white; }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #bdc3c7;
        }
        
        .folio-destacado {
            background: #1a237e;
            color: white;
            padding: 2px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .clave-unica {
            background: #e8eef5;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        
        /* Botones de acción */
        .acciones {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btne {
            padding: 5px 12px;
            border: none;
            border-radius: 12px;
            font-size: 7px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btne-editar {
            background: #83180a;
            color: white;
        }
        
        .btne-editar:hover {
            background: #f34627;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 0, 0, 0.3);
        }
        
        .btn-guardar {
            background: #27ae60;
            color: white;
        }
        
        .btn-guardar:hover {
            background: #219a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-aceptar{
            background: #27ae60;
            color: white;
        }
        
        .btn-guardar:hover {
            background: #219a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-cancelar {
            background: #e74c3c;
            color: white;
        }
        
        .btn-cancelar:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }
        
        .btn-deshabilitado {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .mensaje-exito {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            border: 1px solid #c3e6cb;
            display: none;
        }
        
        .mensaje-error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            border: 1px solid #f5c6cb;
            display: none;
        }
        
        .mensaje-exito.,
        .mensaje-error. {
            display: block;
        }
    </style>
</head>
<body>

<div class="card" id="contenido">
    <div class="loading">
        <div class="spinner"></div>
        <p>Cargando información del equipo...</p>
    </div>
</div>

<script>
    // =====================================================
    // CONFIGURACIÓN
    // =====================================================
    
    const URL_PUBLICA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrXQFc-3LwfW29msop3ojGDKyehHOpC4nyfVYs_DgvKUjXGvauIcpPVRnuKG0hR4kFJQMcZLMp78na/pub?output=csv';
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxXQ6Zj9G_m5i2kut-uuNvUHv_n-Bl6o5wujEKruCWvzdFH2aYsWRnQ4MuvOzmLC8kr/exec';
    
    // =====================================================
    // VARIABLES DE CACHÉ (CORREGIDO)
    // =====================================================
    let datosCargados = null;
    
    // =====================================================
    // FUNCIONES AUXILIARES
    // =====================================================
    
    function obtenerParametro(nombre) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(nombre);
    }
    
    function obtenerClaseEstado(estado) {
        const estados = {
            'En funcionamiento': 'badge-exitoso',
            'En mantenimiento': 'badge-mantenimiento',
            'Con daño': 'badge-dano',
            'Pendiente de revisión': 'badge-pendiente'
        };
        return estados[estado] || 'badge-pendiente';
    }
    
    function generarOpcionesEstado(estadoActual) {
        const opciones = ['En funcionamiento', 'En mantenimiento', 'Con daño', 'Pendiente de revisión'];
        return opciones.map(opcion => 
            `<option value="${opcion}" ${opcion === estadoActual ? 'selected' : ''}>${opcion}</option>`
        ).join('');
    }
    
    function Contraseña(Pssd) {
        const contenedor = document.getElementById('contenido');
        if(Pssd==true){
            contenedor.innerHTML=`
            
                <div class="error">
                    <div class="contenedor-sticky">
                        <img src="logo.png" alt="Imagen sticky">
                    </div>
                    <h2>Introduce la contraseña: QR</h2>
                    <p>.....</p>
                    <div style="margin-top: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px;">
                        <div class="campo campo-editable" style="border-left-color: #e74c3c;">
                        <input type="password" id="Password" placeholder="****" 
                               style="width: 100%; padding: 10px; border: 2px solid #e74c3c; border-radius: 5px; box-sizing: border-box;">
                        <div id="mensaje-error" style="margin-top: 5px; color: #e74c3c; font-size: 14px;">
                            a contraseña ingresada es incorrecta
                        </div>
                    </div>
                        <div class="acciones">
                            <button class="btn btn-aceptar" onclick="verificar(true)">Aceptar</button>
                        </div>

                    </div>
                    <div class="badge">Sistema de inventario</div>
                </div>
            `;
        }
    }

    function verificar(Accion) {
    const input = document.getElementById('Password');
    const contenedor = document.getElementById('contenido');
    const passwordIngresada = input.value.trim();
    
    if (passwordIngresada == "4321") {
        mostrarEquipo(true);
    } else {
        
        contenedor.innerHTML = `
            <div class="error">
                <div class="contenedor-sticky">
                    <img src="logo.png" alt="Imagen sticky">
                </div>
                <h2 style="color: #e74c3c;">Contraseña Incorrecta</h2>
                <p>Intenta nuevamente</p>
                <div style="margin-top: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px;">
                    <div class="campo campo-editable" style="border-left-color: #e74c3c;">
                        <input type="password" id="Password" placeholder="Ingresa la contraseña" 
                               style="width: 100%; padding: 10px; border: 2px solid #e74c3c; border-radius: 5px; box-sizing: border-box;">
                        <div id="mensaje-error" style="margin-top: 5px; color: #e74c3c; font-size: 14px;">
                            a contraseña ingresada es incorrecta
                        </div>
                    </div>
                    <div class="acciones">
                        <button class="btn btn-aceptar" onclick="verificar(true)" 
                                style="background: #e74c3c; color: white; padding: 10px 30px; border: none; border-radius: 5px; cursor: pointer;">
                            Reintentar
                        </button>
                        <button class="btn btn-cancelar" onclick="mostrarEquipo(false)" 
                                style="background: #95a5a6; color: white; padding: 10px 30px; border: none; border-radius: 5px; cursor: pointer;">
                            Cancelar
                        </button>
                    </div>
                </div>
                <div class="badge">Sistema de inventario</div>
            </div>
        `;
        
        setTimeout(() => {
            document.getElementById('Password').focus();
        }, 100);
    }
}

    // =====================================================
    // FUNCIÓN PARA OBTENER DATOS (CORREGIDA)
    // =====================================================
    
    async function obtenerDatosDeGoogleSheets(forzar = false) {
        // Si hay caché y no se fuerza, devolverla
        if (!forzar && datosCargados) {
            return datosCargados;
        }

        try {
            const response = await fetch(URL_PUBLICA);
            if (!response.ok) throw new Error('Error al obtener los datos');
            
            const csvText = await response.text();
            const lineas = csvText.split('\n').filter(linea => linea.trim() !== '');
            const encabezados = lineas[0].split(',').map(h => h.trim());
            
            const resultados = [];
            for (let i = 1; i < lineas.length; i++) {
                const valores = lineas[i].split(',').map(v => v.trim());
                const obj = {};
                for (let j = 0; j < encabezados.length; j++) {
                    let valor = valores[j] || '';
                    valor = valor.replace(/^"|"$/g, '');
                    obj[encabezados[j]] = valor;
                }
                resultados.push(obj);
            }
            
            datosCargados = resultados;
            return resultados;
            
        } catch (error) {
            console.error('Error al cargar datos:', error);
            return null;
        }
    }
    
    
    async function mostrarEquipo(modoEdicion = false, forzarRecarga = false) {
        const contenedor = document.getElementById('contenido');
        const folioBuscado = obtenerParametro('folio');
        
        if (!folioBuscado) {
            contenedor.innerHTML = `
            
                <div class="error">
                    <div class="contenedor-sticky">
                        <img src="logo.png" alt="Imagen sticky">
                    </div>
                    <h2>Escanea un código QR</h2>
                    <p>Este visor mostrará la información del equipo</p>
                    <div style="margin-top: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px;">
                        <p style="font-size: 14px; color: #555;">Ejemplo de URL:</p>
                        <code style="background: #e8eef5; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
                            index.html?folio=A-001
                        </code>
                    </div>
                    <div class="badge">Sistema de inventario</div>
                </div>
            `;
            return;
        }
        
        // Mostrar loading
        contenedor.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Buscando equipo <strong>${folioBuscado}</strong>...</p>
            </div>
        `;
        
        // SOLO UNA LLAMADA A LA API (con el parámetro de forzar)
        const datos = await obtenerDatosDeGoogleSheets(forzarRecarga);
        
        if (!datos) {
            contenedor.innerHTML = `
                <div class="error">
                    <h2>Error de conexión</h2>
                    <p>No se pudo cargar el inventario</p>
                    <p style="font-size: 14px; margin-top: 10px; color: #95a5a6;">
                        Verifica tu conexión a internet
                    </p>
                </div>
            `;
            return;
        }
        
        const equipo = datos.find(item => item.Folio === folioBuscado);
        const esNuevo = !equipo;
        
        const datosEquipo = equipo || {
            Folio: folioBuscado,
            Equipo: '',
            Modelo: '',
            Marca: '',
            Ubicacion: '',
            Zona: '',
            Estado: 'Pendiente de revisión',
            
        };
        
        const claseEstado = obtenerClaseEstado(datosEquipo.Estado);
        
        if (!modoEdicion) {
            if (!equipo) {
                contenedor.innerHTML = `
                
                    <div class="error">
                        <div class="contenedor-sticky">
                            <img src="logo.png" alt="Imagen sticky">
                        </div>
                        <h2>Nuevo equipo</h2>
                        <p>El folio <strong>${folioBuscado}</strong> no existe en el inventario</p>
                        <p style="font-size: 14px; color: #95a5a6; margin-top: 10px;">
                            Haz clic en "Editar" para crear este nuevo registro
                        </p>
                        <div class="acciones">
                            <button class="btne btne-editar" onclick=Contraseña(true) >Crear equipo</button>
                        </div>
                    </div>
                `;
                return;
            }
            
            contenedor.innerHTML = `
                <div class="contenedor-sticky">
                    <img src="logo.png" alt="Imagen sticky">
                </div>

                <h1 class="titulo">Inventario</h1>

                <div class="campo">
                    <div class="etiqueta">Equipo</div>
                    <div class="valor"><span class="folio-destacado">${datosEquipo.Equipo}</span></div>
                </div>
                
                <div class="campo">
                    <div class="etiqueta">Folio</div>
                    <div class="valor"><span class="folio-destacado">${datosEquipo.Folio}</span></div>
                </div>
                
                <div class="campo">
                    <div class="etiqueta">Modelo</div>
                    <div class="valor">${datosEquipo.Modelo || 'No especificado'}</div>
                </div>
                
                <div class="campo">
                    <div class="etiqueta">Marca</div>
                    <div class="valor">${datosEquipo.Marca || 'No especificada'}</div>
                </div>
                
                <div class="campo">
                    <div class="etiqueta">Ubicación</div>
                    <div class="valor">${datosEquipo.Ubicacion || 'No especificada'}</div>
                </div>
                
                <div class="campo">
                    <div class="etiqueta">Zona</div>
                    <div class="valor">${datosEquipo.Zona || 'No especificada'}</div>
                </div>
                
                <div class="campo" style="border-left-color: ${datosEquipo.Estado === 'En funcionamiento' ? '#27ae60' : '#f39c12'};">
                    <div class="etiqueta">Estado</div>
                    <div class="valor">
                        <span class="badge-estado ${claseEstado}">${datosEquipo.Estado || 'No especificado'}</span>
                    </div>
                </div>
                
                <div class="acciones">
                    <button class="btne btne-editar" onclick="Contraseña(true)"></button>
                </div>
                
                <div class="footer">
                    Última actualización: ${new Date().toLocaleString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })}
                </div>
            `;
            return;
        }
        
        contenedor.innerHTML = `
            <div class="contenedor-sticky">
                <img src="lsogo.png" alt="Imagen sticky">
            </div>
            <h1 class="titulo">${esNuevo ? 'Nuevo equipo' : 'Editar equipo'}</h1>
            
            <div class="campo campo-editable" style="border-left-color: #1a237e;">
                <div class="etiqueta">Folio (no editable)</div>
                <div class="valor"><span class="folio-destacado">${datosEquipo.Folio}</span></div>
                <input type="hidden" id="folio-input" value="${datosEquipo.Folio}">
            </div>
            
            <div class="campo campo-editable" style="border-left-color: #667eea;">
                <div class="etiqueta">Equipo *</div>
                <input type="text" id="equipo-input" value="${datosEquipo.Equipo || ''}" placeholder="Ej: Laptop Dell XPS">
            </div>
            
            <div class="campo campo-editable" style="border-left-color: #667eea;">
                <div class="etiqueta">Modelo *</div>
                <input type="text" id="modelo-input" value="${datosEquipo.Modelo || ''}" placeholder="Ej: XPS 13 9310">
            </div>
            
            <div class="campo campo-editable" style="border-left-color: #667eea;">
                <div class="etiqueta">Marca *</div>
                <input type="text" id="marca-input" value="${datosEquipo.Marca || ''}" placeholder="Ej: Dell">
            </div>
            
            <div class="campo campo-editable" style="border-left-color: #667eea;">
                <div class="etiqueta">Ubicación *</div>
                <input type="text" id="ubicacion-input" value="${datosEquipo.Ubicacion || ''}" placeholder="Ej: Edificio A, Piso 3">
            </div>
            
            <div class="campo campo-editable" style="border-left-color: #667eea;">
                <div class="etiqueta">Zona</div>
                <input type="text" id="zona-input" value="${datosEquipo.Zona || ''}" placeholder="Ej: Norte">
            </div>
            
            <div class="campo campo-editable" style="border-left-color: #667eea;">
                <div class="etiqueta">Estado</div>
                <select id="estado-input">
                    ${generarOpcionesEstado(datosEquipo.Estado)}
                </select>
            </div>
            
            <div id="mensaje-exito" class="mensaje-exito">Datos guardados correctamente</div>
            <div id="mensaje-error" class="mensaje-error">Error al guardar los datos</div>
            
            <div class="acciones">
                <button class="btn btn-guardar" onclick="guardarDatos()">Guardar</button>
                <button class="btn btn-cancelar" onclick="mostrarEquipo(false)">Cancelar</button>
            </div>
            
            <div class="footer">
                ${esNuevo ? 'Creando nuevo registro' : 'Editando registro existente'} • Folio: ${datosEquipo.Folio}
            </div>
        `;
    }
    
    // =====================================================
    // FUNCIÓN PARA GUARDAR DATOS
    // =====================================================
    
    async function guardarDatos() {
        const mensajeExito = document.getElementById('mensaje-exito');
        const mensajeError = document.getElementById('mensaje-error');
        const botonGuardar = document.querySelector('.btn-guardar');
        
        botonGuardar.disabled = true;
        botonGuardar.textContent = '⏳ Guardando...';
        mensajeExito.classList.remove('mostrar');
        mensajeError.classList.remove('mostrar');
        
        const datos = {
            Folio: document.getElementById('folio-input').value,
            Equipo: document.getElementById('equipo-input').value.trim(),
            Modelo: document.getElementById('modelo-input').value.trim(),
            Marca: document.getElementById('marca-input').value.trim(),
            Ubicacion: document.getElementById('ubicacion-input').value.trim(),
            Zona: document.getElementById('zona-input').value.trim(),
            Estado: document.getElementById('estado-input').value,
        };
        
        if (!datos.Equipo || !datos.Modelo || !datos.Marca || !datos.Ubicacion) {
            mensajeError.textContent = 'Los campos marcados con * son obligatorios';
            mensajeError.classList.add('mostrar');
            botonGuardar.disabled = false;
            botonGuardar.textContent = 'Guardar';
            return;
        }
        
        try {
            const response = await fetch(URL_SCRIPT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(datos)
            });
            
            const resultado = await response.text();
            
            if (response.ok && !resultado.includes('Error')) {
                mensajeExito.textContent = 'Datos guardados correctamente en el inventario';
                mensajeExito.classList.add('mostrar');
                
                // Forzar recarga de datos frescos
                setTimeout(() => {
                    mostrarEquipo(false, true);
                }, 2000);
            } else {
                throw new Error(resultado || 'Error desconocido');
            }
        } catch (error) {
            mensajeError.textContent = `Error: ${error.message || 'No se pudo guardar los datos'}`;
            mensajeError.classList.add('mostrar');
            botonGuardar.disabled = false;
            botonGuardar.textContent = 'Guardar';
        }
    }
    
    // =====================================================
    // INICIAR LA APLICACIÓN
    // =====================================================
    
    mostrarEquipo(false);
</script>

</body>
</html>
